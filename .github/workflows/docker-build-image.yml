name: Build Docker images

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

# Controls concurrent execution of workflow
# Ensures only one workflow per branch/ref runs at a time
# If a new workflow is triggered while one is in progress, the in-progress workflow will be cancelled
# Uses workflow name and git ref to create unique group identifier
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-base-image:
    if: github.repository_owner == 'LCAS'
    runs-on: 
      - lcas

    steps:
    - name: Node Js
      uses: actions/setup-node@v4
      with:
        node-version: "^16.13.0 || >=18.0.0"

    - name: Sanitize repo slug
      uses: actions/github-script@v6
      id: repo_slug
      with:
        result-encoding: string
        script: return '${{ github.repository }}'.toLowerCase()
    - uses: AutoModality/action-clean@v1      
    - uses: actions/checkout@v4

    - name: Docker Login LCAS
      uses: docker/login-action@v3
      with:
        registry: lcas.lincoln.ac.uk
        username: ${{ secrets.LCAS_REGISTRY_PUSHER }}
        password: ${{ secrets.LCAS_REGISTRY_TOKEN }}

    - name: Docker meta base
      id: meta_base
      uses: docker/metadata-action@v5
      with:
        flavor: |
          latest=auto
        # list of Docker images to use as base name for tags
        images: |
          lcas.lincoln.ac.uk/${{ steps.repo_slug.outputs.result }}
        # generate Docker tags based on the following events/attributes
        labels: |
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.base=lcas.lincoln.ac.uk/lcas/ros-docker-images:jammy-cuda12.2-humble-2.1.0
          maintainer=AOC
          com.github.workflow.runner.name=${{ runner.name }}
          com.github.workflow.runner.os=${{ runner.os }}
          com.github.workflow.runner.arch=${{ runner.arch }}
          com.github.workflow.run_id=${{ github.run_id }}
          com.github.workflow.name=${{ github.workflow }}
          org.ros.distro=humble
        tags: |
          type=ref,event=branch,enable=${{ github.event_name != 'pull_request' }}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest-pr,enable=${{ github.event_name == 'pull_request' }}
          type=raw,value=staging
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build base Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile
        platforms: linux/amd64
        push: true
        load: true
        cache-from: |
          ${{ steps.meta_base.outputs.tags }}
          type=registry,ref=lcas.lincoln.ac.uk/cache/${{ steps.repo_slug.outputs.result }}:latest
        cache-to: type=registry,ref=lcas.lincoln.ac.uk/cache/${{ steps.repo_slug.outputs.result }}:latest,mode=max
        tags: ${{ steps.meta_base.outputs.tags }}
        labels: ${{ steps.meta_base.outputs.labels }}
        target: user_space
        build-args: |
          BUILDKIT_INLINE_CACHE=1
          BASE_IMAGE=lcas.lincoln.ac.uk/lcas/ros-docker-images:jammy-cuda12.2-humble-2.1.0